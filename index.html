<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Impact,"Arial Black",sans-serif;color:#fff}
  canvas{display:block;touch-action:none}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<body>
<div id="menu">
  <h1><span>SIN</span> STREET</h1>
  <div class="sub">The city never sleeps. Neither do its killers.</div>
  <button id="vr" class="red" disabled>CHECKING VR…</button>
  <button id="pv">PREVIEW (TAP TO SHOOT)</button>
  <div id="how">Shoot the thugs on the beat · Lean past the signs · Squat under the beams · Dodge the red bullets<br>Stand in the center of your play space.</div>
  <div id="msg"></div>
</div>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const MSG = s => { $('msg').textContent = s; };
window.addEventListener('error', e => MSG('Error: ' + e.message));

/* =========================================================
   CORE CONSTANTS + SEEDED GENERATOR
   ========================================================= */
const Q = new URLSearchParams(location.search);
const SEED = +(Q.get('seed') || 1953);
const BOT = Q.has('bot');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const BPM = 104, SPB = 60 / BPM, BAR = 4 * SPB;
const SECTIONS = [['intro',4],['verse',8],['build',4],['drop',8],['verse2',8],['build',4],['drop',8],['bridge',4],['drop3',12],['outro',4]];
const BARS = [];
SECTIONS.forEach(([name, n], si) => { for (let i = 0; i < n; i++) BARS.push({ sec: name, i, n, si, idx: BARS.length, start: BARS.length * BAR }); });
const NBARS = BARS.length;
const SONG_END = NBARS * BAR + 2.0;

const LEAD = 1.0, LATE = 0.45, SPEED = 2.5, PERF_D = 9;
const SLOTS = [
  {x:-6.0,y:4.3,w:1},{x:-6.0,y:2.3,w:1},{x:-3.4,y:1.45,w:0},{x:-1.5,y:1.45,w:0},
  {x: 6.0,y:4.3,w:1},{x: 6.0,y:2.3,w:1},{x: 3.4,y:1.45,w:0},{x: 1.5,y:1.45,w:0}];
SLOTS.forEach(s => { s.z = -Math.sqrt(Math.max(9, PERF_D*PERF_D - s.x*s.x - (s.y-1.6)**2)); s.side = s.x < 0 ? 'L' : 'R'; });

const CH = { Am:{r:45,q:[0,3,7]}, F:{r:41,q:[0,4,7]}, C:{r:48,q:[0,4,7]}, G:{r:43,q:[0,4,7]}, Em:{r:40,q:[0,3,7]} };
const PROG = { intro:['Am','F','C','G'], verse:['Am','F','C','G'], verse2:['Am','F','C','G'], build:['Am','F','G','G'],
  drop:['Am','Am','F','G'], drop3:['Am','Am','F','G'], bridge:['F','G','Am','Am'], outro:['Am','F','C','Am'] };
const chordOf = B => CH[PROG[B.sec][B.i % 4]];
const SCALE = [0,2,3,5,7,8,10,12,14,15,17,19,20];

/* =========================================================
   SONG GENERATION (same rng feeds the chart)
   ========================================================= */
function makeMotif(rng){
  const m = []; let deg = 4 + Math.floor(rng()*3);
  for (let s = 0; s < 16; s++) {
    if (s === 0 || rng() < 0.55) {
      const dur = (s < 15 && rng() < 0.3) ? 2 : 1;
      deg = Math.max(0, Math.min(12, deg + [-2,-1,1,2,0,-3,3][Math.floor(rng()*7)]));
      m.push({ s, dur, deg }); s += dur - 1;
    }
  }
  return m;
}
function makeBassPat(rng){
  const P = [1,0,.5,.3,.6,0,.55,.4,.9,0,.5,.3,.6,.3,.5,.5], out = [];
  for (let s = 0; s < 16; s++) if (s === 0 || rng() < P[s]) out.push({ s, o: (s % 4 === 2 || rng() < 0.25) ? 12 : 0 });
  return out;
}
function makeWob(rng){
  const h = [{ b:0, d:1.5, o:0, r:2 }]; let b = 1.5;
  while (b < 8) {
    if (b >= 4 && b < 4.25) { const d = rng() < 0.5 ? 1.5 : 1; h.push({ b:4, d, o:0, r: rng()<0.5?2:4 }); b = 4 + d; continue; }
    const d = Math.min([0.25,0.5,0.5,0.75][Math.floor(rng()*4)], 8 - b);
    if (rng() < 0.7) h.push({ b, d, o:[0,12,7,3,0][Math.floor(rng()*5)], r:[2,4,3][Math.floor(rng()*3)] });
    b += d;
  }
  return h;
}

function buildSong(rng){
  const N = []; const add = (t, f, ...a) => N.push({ t, f, a });
  const motifs = [makeMotif(rng), makeMotif(rng), makeMotif(rng)];
  const bassA = makeBassPat(rng), bassB = makeBassPat(rng);
  const wobs = [makeWob(rng), makeWob(rng), makeWob(rng)];
  const ghost = []; for (let s = 0; s < 16; s++) ghost.push(rng() < 0.35);
  const playMotif = (m, t0, oct=0, vel=1) => { for (const n of m) add(t0 + n.s*SPB/2, 'lead', n.dur*SPB/2*0.92, 69 + SCALE[n.deg] + oct, vel); };

  for (const B of BARS) {
    const t0 = B.start, c = chordOf(B), sec = B.sec, i = B.i;
    const nxt = BARS[B.idx + 1];
    const cut = (nxt && nxt.sec.startsWith('drop') && nxt.i === 0) ? 3*SPB : BAR;   // beat of silence before every drop
    const pad = c.q.map(q => c.r + 12 + q);
    const arp = (cutoff, vel=1, steps=16) => { const tones = [...pad, pad[0]+12]; for (let s = 0; s < steps; s++) { const tt = s*SPB/4; if (tt >= cut - 0.01) break; add(t0+tt, 'arp', SPB/4*0.8, tones[s%4] + 12, cutoff, vel); } };
    const hats = (open) => { for (let s = 0; s < 16; s++) { const tt = s*SPB/4; if (tt >= cut - 0.01) break; if (s % 4 === 2) add(t0+tt, 'hat', 0.8, open); else if (ghost[s] && s % 2) add(t0+tt, 'hat', 0.35, false); } };
    const kicks = (v=1) => { for (let b = 0; b < 4; b++) if (b*SPB < cut - 0.01) add(t0 + b*SPB, 'kick', v); };

    if (sec === 'intro') {
      add(t0, 'pad', BAR, pad, 400 + i*350);
      arp(300 + i*300, 0.7 + i*0.1);
      if (i >= 2) kicks(0.75);
      if (i === 3) hats(false);
      if (i === 0) add(t0, 'riser', 4*BAR - SPB*0.5, 0.12);
    }
    else if (sec === 'verse' || sec === 'verse2') {
      const v2 = sec === 'verse2';
      kicks(); add(t0 + SPB, 'snare', 0.9, false); add(t0 + 3*SPB, 'snare', 0.9, false); hats(v2);
      for (const n of (i % 4 === 3 ? bassB : bassA)) add(t0 + n.s*SPB/4, 'bass', SPB/4*0.85, c.r - 12 + n.o);
      arp(v2 ? 2200 : 1300, 0.8);
      add(t0, 'pad', BAR, pad, 900);
      const mi = v2 ? [2,2,1,2] : [0,0,1,0];
      if (i % 2 === 0) playMotif(motifs[mi[Math.floor(i/2)]], t0, v2 ? 12 : 0, v2 ? 0.9 : 1);
    }
    else if (sec === 'build') {
      if (i === 0) add(t0, 'riser', 4*BAR - SPB, 0.3);
      kicks(0.9);
      const step = [SPB, SPB/2, SPB/4, SPB/4][i];
      for (let tt = 0; tt < cut - 0.01; tt += (i === 3 && tt >= 2*SPB) ? SPB/8 : step) add(t0 + tt, 'snare', 0.35 + 0.15*i + tt/BAR*0.15, false);
      for (let s = 0; s < 8; s++) if (s*SPB/2 < cut - 0.01) add(t0 + s*SPB/2, 'bass', SPB/2*0.8, c.r - 12 + (s % 2 ? 12 : 0));
      arp(1500 + i*600, 0.8);
      add(t0, 'pad', cut, pad, 1200 + i*400);
    }
    else if (sec === 'drop' || sec === 'drop3') {
      if (i === 0) add(t0, 'impact');
      add(t0, 'kick', 1.1); add(t0 + 2*SPB, 'snare', 1.2, true);
      if (i % 2 === 1) add(t0 + 2.5*SPB, 'kick', 0.8);
      for (let s = 0; s < 8; s++) add(t0 + s*SPB/2, 'hat', s % 2 ? 0.7 : 0.35, false);
      if (i % 2 === 0) {
        const W = wobs[(sec === 'drop3' ? 2 : 0) + (Math.floor(i/4) % 2 && sec !== 'drop3' ? 1 : 0)];
        for (const h of W) { const Bh = h.b >= 4 ? BARS[B.idx + 1] : B; const ch = chordOf(Bh); add(t0 + h.b*SPB, 'wob', h.d*SPB*0.95, ch.r - 12 + h.o, h.r); }
      }
      if (sec === 'drop3' && i >= 8) { arp(3000, 0.7); if (i % 2 === 0) playMotif(motifs[0], t0, 12, 0.7); }
    }
    else if (sec === 'bridge') {
      add(t0, 'pad', cut, pad, 1600);
      arp(900 + i*500, 0.6);
      if (i % 2 === 0) playMotif(motifs[1], t0, 0, 0.9);
      if (i >= 2) for (let b = 0; b < 4; b++) if (b*SPB < cut - 0.01) add(t0 + b*SPB, 'kick', 0.6);
      if (i === 3) for (let tt = 0; tt < cut - 0.01; tt += SPB/4) add(t0 + tt, 'snare', 0.3 + tt/BAR*0.6, false);
      if (i === 2) add(t0, 'riser', 2*BAR - SPB, 0.25);
    }
    else if (sec === 'outro') {
      add(t0, 'pad', i === 3 ? BAR*1.8 : BAR, pad, 1400 - i*250);
      arp(1500 - i*300, 0.7 - i*0.12);
      if (i < 2) { kicks(0.8); add(t0 + SPB, 'snare', 0.6, false); add(t0 + 3*SPB, 'snare', 0.6, false); }
      if (i === 0) playMotif(motifs[0], t0, 0, 0.8);
      if (i === 3) add(t0, 'wob', BAR, c.r - 12, 1);
    }
  }
  // enforce one beat of total silence before every drop
  const gaps = BARS.filter(B => B.sec.startsWith('drop') && B.i === 0).map(B => [B.start - SPB, B.start]);
  const out = N.filter(n => !gaps.some(([a, b]) => n.t >= a - 1e-4 && n.t < b - 1e-4));
  for (const n of out) if (['lead','bass','arp','pad','wob','riser'].includes(n.f)) for (const [a] of gaps) if (n.t < a && n.t + n.a[0] > a) n.a[0] = Math.max(0.05, a - n.t - 0.12);
  out.sort((a, b) => a.t - b.t);
  return out;
}

/* =========================================================
   CHART GENERATION
   ========================================================= */
function buildChart(rng){
  const tg = [], ob = []; const E = 2*SPB - 1e-3;
  const obsOK = t => !ob.some(o => Math.abs(o.t - t) < E) && !tg.some(x => Math.abs(x.t - t) < E);
  const tgtOK = (t, s) => {
    if (ob.some(o => Math.abs(o.t - t) < E)) return false;
    for (const x of tg) { const dt = Math.abs(x.t - t), dx = Math.abs(SLOTS[x.s].x - SLOTS[s].x);
      if (dt < E && dx < 1) return false;           // never stacked on the same column
      if (dt < 1e-3 && dx < 3) return false; }      // simultaneous targets far apart
    return true;
  };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let side = 'L', lastS = -1, wallSide = 1;
  const flip = () => { if (rng() < 0.78) side = side === 'L' ? 'R' : 'L'; return side; };
  const other = sd => sd === 'L' ? 'R' : 'L';
  const addT = (t, sd, fire = 0) => {
    const cands = shuffle(SLOTS.map((_, i) => i).filter(i => SLOTS[i].side === sd && i !== lastS));
    for (const s of cands) {
      if (!tgtOK(t, s)) continue;
      if (fire) { const a = t + fire*SPB; if (!obsOK(a)) return false; tg.push({ t, s, fire }); ob.push({ t:a, k:'bullet' }); }
      else tg.push({ t, s, fire: 0 });
      lastS = s; return true;
    }
    return false;
  };
  const addO = (t, k) => {
    if (!obsOK(t)) return false;
    const o = { t, k }; if (k === 'wall') { o.side = wallSide; wallSide = rng() < 0.8 ? -wallSide : wallSide; }
    ob.push(o); return true;
  };

  SECTIONS.forEach(([name], si) => {
    const bars = BARS.filter(B => B.si === si); const T = (B, b) => B.start + b*SPB;
    const isV = name.startsWith('verse'), isD = name.startsWith('drop');
    // pass 1: obstacles
    if (isV) for (const B of bars) if (B.i % 4 === 3) addO(T(B, 0), rng() < 0.6 ? 'wall' : 'duck');
    const pend = [];
    if (isD) { let sq = 0; for (const B of bars) {
      const r = rng(); const k = B.i === 0 ? 'squat' : r < 0.2 ? 'bullet' : (r < 0.62 && sq < 2) ? 'squat' : 'wall';
      if (k === 'bullet') { pend.push(B); sq = 0; continue; }
      addO(T(B, 0), k); sq = k === 'squat' ? sq + 1 : 0; } }
    // pass 2: shooters (their bullets land on the beat)
    if (isD) for (const B of pend) { const P = BARS[B.idx - 1]; if (!addT(T(P, 2), flip(), 2)) addO(T(B, 0), 'wall'); }
    if (isV) { let k = name === 'verse' ? 2 : 4; for (const [B, b] of shuffle(bars.flatMap(B => [[B,0],[B,2]]))) { if (k <= 0) break; if (addT(T(B, b), flip(), 3)) k--; } }
    // pass 3: regular targets
    for (const B of bars) {
      let beats = [], pDouble = 0, p = 1;
      if (name === 'intro') beats = B.i >= 2 ? [0, 2] : [];
      else if (isV) { beats = [0,1,2,3]; p = name === 'verse' ? 0.88 : 0.95; pDouble = name === 'verse' ? 0.08 : 0.22; }
      else if (name === 'build') { beats = B.i < 3 ? [0,1,2,3] : [0,1,2]; pDouble = B.i >= 1 ? 0.4 : 0; }
      else if (isD) { beats = [2]; pDouble = name === 'drop3' ? 0.65 : 0.45; }
      else if (name === 'bridge') beats = [0, 2];
      else if (name === 'outro') beats = B.i < 2 ? [0, 2] : [];
      for (const b of beats) {
        const t = T(B, b);
        if (rng() > p) continue;
        const existing = tg.find(x => Math.abs(x.t - t) < 1e-3);
        if (existing) { if (rng() < 0.5) addT(t, other(SLOTS[existing.s].side)); continue; }
        const sd = flip(); addT(t, sd);
        if (rng() < pDouble) addT(t, other(sd));
      }
    }
  });
  tg.sort((a, b) => a.t - b.t); ob.sort((a, b) => a.t - b.t);
  return { tg, ob };
}

const rng = mulberry32(SEED);
const SONG = buildSong(rng);
const CHART = buildChart(rng);

/* =========================================================
   AUDIO ENGINE (Web Audio, no files, no reverb)
   ========================================================= */
let ctx, master, drums, music, duckG, delayIn, noiseBuf, distCurve;
function initAudio(){
  if (ctx) return ctx.resume();
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(ctx.destination);
  drums = ctx.createGain(); drums.gain.value = 0.9; drums.connect(master);
  duckG = ctx.createGain(); duckG.connect(master);
  music = ctx.createGain(); music.gain.value = 0.75; music.connect(duckG);
  const d = ctx.createDelay(1); d.delayTime.value = SPB*0.75;
  const fb = ctx.createGain(); fb.gain.value = 0.28;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  delayIn = ctx.createGain(); delayIn.gain.value = 0.28;
  delayIn.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(music);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0); const nr = mulberry32(7); for (let i = 0; i < nd.length; i++) nd[i] = nr()*2 - 1;
  distCurve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i/511.5 - 1; distCurve[i] = (1 + 6)*x/(1 + 6*Math.abs(x)); }
  return ctx.resume();
}
const mf = m => 440*Math.pow(2, (m - 69)/12);
function osc(type, f, t, end){ const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(end); return o; }
function gainEnv(t, peak, a, end){ const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, end); return g; }
function noise(t, end, loop){ const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = !!loop; s.start(t, (t*7.31) % 1.5); s.stop(end); return s; }
function duck(t){ duckG.gain.setValueAtTime(0.32, t); duckG.gain.linearRampToValueAtTime(1, t + 0.24); }
const INST = {
  kick(t, v=1){ const o = osc('sine', 165, t, t + 0.5); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = gainEnv(t, v, 0.003, t + 0.45); o.connect(g); g.connect(drums); duck(t); },
  snare(t, v=1, big){ const end = t + (big ? 0.45 : 0.2); const n = noise(t, end); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = big ? 900 : 1500;
    const g = gainEnv(t, v*0.55, 0.002, end); n.connect(f); f.connect(g); g.connect(drums);
    const o = osc('triangle', big ? 185 : 225, t, t + 0.2); o.frequency.exponentialRampToValueAtTime(120, t + 0.1); const g2 = gainEnv(t, v*0.6, 0.002, t + 0.16); o.connect(g2); g2.connect(drums); },
  hat(t, v=1, open){ const end = t + (open ? 0.2 : 0.045); const n = noise(t, end); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500;
    const g = gainEnv(t, v*0.22, 0.001, end); n.connect(f); f.connect(g); g.connect(drums); },
  bass(t, dur, m){ const end = t + dur + 0.05; const o = osc('sawtooth', mf(m), t, end); const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 7;
    f.frequency.setValueAtTime(2300, t); f.frequency.exponentialRampToValueAtTime(380, t + dur);
    const g = gainEnv(t, 0.32, 0.004, end); o.connect(f); f.connect(g); g.connect(music); },
  arp(t, dur, m, cut, v=1){ const end = t + dur; const o = osc('square', mf(m), t, end + 0.02); const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = 3;
    const g = gainEnv(t, 0.05*v, 0.003, end); o.connect(f); f.connect(g); g.connect(music); },
  pad(t, dur, ms, cut){ const end = t + dur; const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.06, t + Math.min(0.4, dur*0.3)); g.gain.setValueAtTime(0.06, end - 0.15); g.gain.linearRampToValueAtTime(0.0001, end);
    for (const m of ms) for (const dt of [-8, 8]) { const o = osc('sawtooth', mf(m), t, end + 0.02); o.detune.value = dt; o.connect(f); }
    f.connect(g); g.connect(music); },
  lead(t, dur, m, v=1){ const end = t + dur + 0.1; const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(3800, t); f.frequency.exponentialRampToValueAtTime(1600, t + dur); f.Q.value = 2;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.1*v, t + 0.01); g.gain.setValueAtTime(0.08*v, t + dur); g.gain.exponentialRampToValueAtTime(0.0001, end);
    for (const dt of [-6, 6]) { const o = osc('sawtooth', mf(m), t, end); o.detune.value = dt; o.connect(f); }
    f.connect(g); g.connect(music); g.connect(delayIn); },
  wob(t, dur, m, rate){ const end = t + dur + 0.04;
    const sh = ctx.createWaveShaper(); sh.curve = distCurve;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 9; f.frequency.setValueAtTime(900, t);
    const lfo = osc('sine', BPM/60*rate, t, end); const lg = ctx.createGain(); lg.gain.value = 800; lfo.connect(lg); lg.connect(f.frequency);
    const a = osc('sawtooth', mf(m + 12), t, end), b = osc('square', mf(m + 24), t, end); b.detune.value = 7;

  const g = panelTex.userData.g; g.clearRect(0, 0, 1024, 768);
  g.fillStyle = 'rgba(0,0,0,0.88)'; g.fillRect(0, 0, 1024, 768); g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(10, 10, 1004, 748);
  g.fillStyle = RED; g.fillRect(10, 10, 1004, 10);
  g.textAlign = 'center';
  for (const [txt, size, col, y, font] of lines) { g.font = `${font || 'bold'} ${size}px ${font ? 'Georgia, serif' : 'Impact, "Arial Black", sans-serif'}`; g.fillStyle = col; g.fillText(txt, 512, y); }
  panelTex.needsUpdate = true;
}
function showStartPanel(){
  drawPanel([['SIN', 150, RED, 190], ['STREET', 150, '#fff', 330],
    ['Shoot on the beat · Lean past signs · Squat under beams', 40, '#ddd', 430, 'italic'],
    ['Dodge the red bullets', 40, '#ddd', 485, 'italic'],
    [isXR() ? 'Stand tall in the center — PULL TRIGGER TO START' : 'TAP / CLICK TO START', 46, '#fff', 610],
    ['A song generated in code · seed ' + SEED, 28, '#777', 700, 'italic']]);
  placePanels(); panel.visible = true;
}
function placePanels(){ panel.position.set(0, calibY, -2.6); hud.position.set(0, calibY + 0.62, -3.4); }

/* ---------- guns ---------- */
const gunMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee }), gunDark = new THREE.MeshBasicMaterial({ color: 0x111111 });
function makeGun(){
  const g = new THREE.Group();
  const slide = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.045, 0.2), gunMat); slide.position.set(0, 0, -0.07); g.add(slide);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.11, 0.045), gunDark); grip.position.set(0, -0.055, 0.0); grip.rotation.x = 0.35; g.add(grip);
  const sight = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.012, 0.012), redMat); sight.position.set(0, 0.028, -0.16); g.add(sight);
  const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.0015, 0.0015, 12, 4).rotateX(Math.PI/2).translate(0, 0, -6.17), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, depthWrite: false })); g.add(laser);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.12), new THREE.MeshBasicMaterial({ map: flashTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); fl.position.z = -0.2; fl.visible = false; g.add(fl);
  g.userData.flash = fl; return g;
}
const tracerMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
const controllers = [0, 1].map(i => {
  const c = renderer.xr.getController(i); const gun = makeGun(); c.add(gun); c.userData.gun = gun;
  const tg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]); const tr = new THREE.Line(tg, tracerMat); tr.visible = false; tr.frustumCulled = false; scene.add(tr); c.userData.tracer = tr; c.userData.trT = -1;
  c.addEventListener('connected', e => { c.userData.src = e.data; });
  c.addEventListener('disconnected', () => { c.userData.src = null; });
  c.addEventListener('selectstart', () => onTrigger(c));
  scene.add(c); return c;
});
function haptic(c, v, ms){ try { const h = c?.userData.src?.gamepad?.hapticActuators?.[0]; if (h) h.pulse(v, ms); } catch (e) {} }

/* =========================================================
   GAME STATE
   ========================================================= */
let state = 'menu', mode = 'preview', calibY = 1.6;
let score, combo, maxCombo, shots, hits, tHits, misses, squats, dodges, bumps, bulletsShot, frames, playStart, ti, oi, squatDown, kbUsed = false, endT = 0;
const isXR = () => renderer.xr.isPresenting;
const mult = () => Math.min(4, 1 + Math.floor(combo/10));
const head = new THREE.Vector3(0, 1.6, 0);
function resetStats(){ score = combo = maxCombo = shots = hits = tHits = misses = squats = dodges = bumps = bulletsShot = frames = 0; ti = oi = 0; squatDown = false; }
resetStats();

function startGame(){
  resetStats();
  if (isXR()) { stage.position.set(head.x + stage.position.x, 0, head.z + stage.position.z); calibY = Math.max(1.0, head.y); }
  else { stage.position.set(0, 0, 0); calibY = 1.6; }
  head.set(0, calibY, 0);
  for (const T of targets) { T.state = 'idle'; T.g.visible = false; }
  for (const b of bullets) { b.on = false; b.g.visible = false; }
  for (const w of [...walls, ...bars]) { w.on = false; w.g.visible = false; }
  placePanels(); panel.visible = false; hud.visible = true; drawHUD();
  songStart = ctx.currentTime + 0.3; noteIdx = 0; playStart = performance.now();
  state = 'playing'; scheduleAudio();
}
function endGame(){
  state = 'results'; endT = performance.now(); hud.visible = false;
  const secs = (endT - playStart)/1000, fps = frames/secs;
  const acc = shots ? Math.round(100*hits/shots) : 0;
  const kcal = Math.round(secs/60*7.5 + squats*0.35 + dodges*0.12);
  window.__results = { score, acc, maxCombo, tHits, total: CHART.tg.length, squats, dodges, bumps, kcal, fps: Math.round(fps) };
  drawPanel([['CASE CLOSED', 100, RED, 120],
    [score.toLocaleString(), 130, '#fff', 255],
    [`ACCURACY ${acc}%    MAX COMBO ${maxCombo}`, 48, '#fff', 340],
    [`THUGS ${tHits}/${CHART.tg.length}    BULLETS SHOT ${bulletsShot}`, 44, '#ddd', 405],
    [`SQUATS ${squats}    DODGES ${dodges}    HITS TAKEN ${bumps}`, 44, '#ddd', 465],
    [`~${kcal} kcal    AVG ${Math.round(fps)} FPS`, 44, '#ddd', 525],
    [isXR() ? 'Pull trigger to ride again' : 'Tap to ride again', 44, '#fff', 650]]);
  placePanels(); panel.visible = true;
}

/* ---------- shooting ---------- */
const _o = new THREE.Vector3(), _d = new THREE.Vector3(), _v = new THREE.Vector3(), _hit = new THREE.Vector3(), _wq = new THREE.Quaternion();
function raySphere(o, d, c, r){ _v.subVectors(c, o); const tca = _v.dot(d); if (tca < 0) return -1; const d2 = _v.lengthSq() - tca*tca; return d2 <= r*r ? tca : -1; }
function fire(o, d, c){
  const t = songTime(); shots++;
  let best = null, bd = 1e9, kind = 0;
  for (const T of targets) if (T.state === 'live') { const dist = raySphere(o, d, T.g.position, T.r); if (dist > 0 && dist < bd) { bd = dist; best = T; kind = 1; } }
  for (const b of bullets) if (b.on) { const dist = raySphere(o, d, b.g.position, 0.26); if (dist > 0 && dist < bd) { bd = dist; best = b; kind = 2; } }
  if (kind === 1) hitTarget(best, t);
  else if (kind === 2) { best.on = false; best.g.visible = false; hits++; bulletsShot++; combo++; maxCombo = Math.max(maxCombo, combo); score += 50*mult(); showLabel('BULLET', best.g.position, t); drawHUD(); }
  if (c) { haptic(c, kind ? 0.6 : 0.3, kind ? 40 : 20); c.userData.gun.userData.flash.visible = true; c.userData.trT = performance.now();
    const tr = c.userData.tracer, p = tr.geometry.attributes.position; _hit.copy(d).multiplyScalar(kind ? bd : 40).add(o).add(stage.position);
    const ow = _v.copy(o).add(stage.position); p.setXYZ(0, ow.x, ow.y, ow.z); p.setXYZ(1, _hit.x, _hit.y, _hit.z); p.needsUpdate = true; tr.visible = true; }
}
function hitTarget(T, t){
  const dt = t - T.data.t, ad = Math.abs(dt);
  const key = ad <= 0.07 ? 'PERFECT' : ad <= 0.16 ? 'GREAT' : ad <= 0.3 ? 'GOOD' : dt < 0 ? 'EARLY' : 'LATE';
  const base = { PERFECT: 300, GREAT: 200, GOOD: 120, EARLY: 80, LATE: 80 }[key];
  combo++; maxCombo = Math.max(maxCombo, combo); score += base*mult(); hits++; tHits++;
  T.state = 'hit'; T.dieT = t; T.mat.color.copy(REDC); T.ring.visible = false;
  showLabel(key, T.g.position, t); drawHUD();
}
function onTrigger(c){
  if (state === 'ready') { startGame(); return; }
  if (state === 'results') { if (performance.now() - endT > 1500) { state = 'ready'; showStartPanel(); } return; }
  if (state !== 'playing') return;
  c.getWorldPosition(_o).sub(stage.position); c.getWorldQuaternion(_wq); _d.set(0, 0, -1).applyQuaternion(_wq);
  fire(_o, _d, c);
}
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (isXR()) return;
  if (state === 'ready') { startGame(); return; }
  if (state === 'results') { if (performance.now() - endT > 1500) { state = 'ready'; showStartPanel(); } return; }
  if (state !== 'playing') return;
  ndc.set(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1); raycaster.setFromCamera(ndc, camera);
  _o.copy(raycaster.ray.origin).sub(stage.position); fire(_o, raycaster.ray.direction, null);
});
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (/Key[ADS]|Arrow/.test(e.code)) kbUsed = true; });
addEventListener('keyup', e => { keys[e.code] = false; });

/* ---------- hits on the player ---------- */
let dmgT = -9;
function bump(t, pos){ bumps++; combo = 0; drawHUD(); dmgT = t; dmg.visible = true; for (const c of controllers) haptic(c, 1, 120); _v.set(head.x, head.y - 0.4, head.z - 1.5); showLabel('HIT', _v, t); }
const harmless = () => !isXR() && !kbUsed;

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastNow = performance.now(), envT = 0;
function loop(time, frame){
  const now = performance.now(), dtR = Math.min(0.1, (now - lastNow)/1000); lastNow = now;
  // head pose
  if (isXR() && frame) { const pose = frame.getViewerPose(renderer.xr.getReferenceSpace()); if (pose) { const p = pose.transform.position; head.set(p.x - stage.position.x, p.y, p.z - stage.position.z); } }
  else if (!isXR()) {
    const tx = (keys.KeyA || keys.ArrowLeft ? -0.3 : 0) + (keys.KeyD || keys.ArrowRight ? 0.3 : 0), ty = calibY - (keys.KeyS || keys.ArrowDown ? 0.5 : 0);
    camera.position.x += (tx - camera.position.x)*Math.min(1, dtR*12); camera.position.y += (ty - camera.position.y)*Math.min(1, dtR*12);
    head.copy(camera.position);
  }
  if (state === 'playing') { const t = songTime(); envT = t; scheduleAudio(); update(t); frames++; }
  else envT += dtR*0.5;
  // environment scroll
  facL.offset.x = (SPEED*envT/SEG) % 1; facR.offset.x = -(SPEED*envT/SEG) % 1; streetTex.offset.y = (SPEED*envT/STREET_TILE) % 1;
  rainMat.uniforms.uT.value = envT; updateLamps(envT);
  for (const c of controllers) if (c.userData.trT > 0 && now - c.userData.trT > 60) { c.userData.trT = -1; c.userData.tracer.visible = false; c.userData.gun.userData.flash.visible = false; }
  for (const c of controllers) c.userData.gun.visible = isXR();
  renderer.render(scene, camera);
}

function update(t){
  // calibrate standing height during the intro (take the tallest reading)
  if (isXR() && t < 4*BAR && t > 0.5) calibY = Math.max(calibY, head.y);
  if (state !== 'playing') return;
  // squat reps
  if (!squatDown && head.y < calibY - 0.25) squatDown = true;
  else if (squatDown && head.y > calibY - 0.12) { squatDown = false; squats++; }

  // spawn targets
  while (ti < CHART.tg.length && CHART.tg[ti].t - LEAD <= t) {
    const d = CHART.tg[ti++]; const T = targets.find(x => x.state === 'idle'); if (T) T.spawn(d);
  }
  for (const T of targets) {
    if (T.state === 'idle') continue;
    const d = T.data, S = T.slot;
    T.g.position.set(S.x, S.y, S.z + SPEED*(t - d.t));
    T.g.rotation.y = Math.atan2(head.x - S.x, head.z - T.g.position.z);
    if (T.state === 'live') {
      const age = t - (d.t - LEAD); T.g.scale.y = Math.min(1, 0.05 + age/0.12);
      const toBeat = d.t - t;
      if (toBeat <= SPB && toBeat > -0.05) { T.ring.visible = true; const k = Math.max(0, toBeat/SPB); const s = (1 + 0.9*k)*(S.w ? 1 : 0.8); T.ring.scale.set(s, s, 1); } else T.ring.visible = false;
      if (BOT && !T.botDone && t >= d.t - 0.008) { T.botDone = true; hitTarget(T, t); continue; }
      if (d.fire && !T.fired && t >= d.t) { T.fired = true; enemyFire(T, t); }
      if (t > d.t + LATE) { T.state = 'miss'; T.dieT = t; combo = 0; misses++; showLabel('MISS', T.g.position, t); drawHUD(); }
    } else {
      const k = (t - T.dieT)/(T.state === 'hit' ? 0.35 : 0.15);
      if (T.state === 'hit') { T.g.scale.set(1 + k*0.15, Math.max(0.01, 1 - k*k), 1); } else T.g.scale.y = Math.max(0.01, 1 - k);
      if (k >= 1) { T.state = 'idle'; T.g.visible = false; }
    }
  }
  // obstacles
  while (oi < CHART.ob.length && CHART.ob[oi].t - t < 14) {
    const o = CHART.ob[oi++]; if (o.k === 'bullet') continue;
    const pool = o.k === 'wall' ? walls : bars; const P = pool.find(x => !x.on); if (!P) continue;
    P.on = true; P.o = o; P.done = false; P.g.visible = true;
    if (o.k === 'wall') { const s = o.side, inner = -s*0.08; P.g.position.set(inner + s*1.2, 1.7, 0); P.g.userData.strip.position.x = -s*1.2; }
    else { const dip = o.k === 'squat' ? 0.42 : 0.28; const bottom = calibY - dip + 0.1; const u = P.g.userData; P.g.position.set(0, 0, 0);
      u.beam.position.y = bottom + 0.07; u.red.position.y = bottom + 0.005; u.red.scale.y = o.k === 'squat' ? 2 : 1; u.p1.scale.y = u.p2.scale.y = bottom; P.bottom = bottom; }
  }
  for (const P of [...walls, ...bars]) {
    if (!P.on) continue;
    const z = -SPEED*(P.o.t - t); P.g.position.z = z;
    if (!P.done && z >= head.z) {
      P.done = true; let hit;
      if (P.o.k === 'wall') hit = P.o.side*head.x > -0.18;
      else hit = head.y + 0.1 > P.bottom;
      if (hit && !harmless() && !BOT) bump(t); else { dodges++; }
    }
    if (z > 3) { P.on = false; P.g.visible = false; }
  }
  // bullets
  for (const b of bullets) {
    if (!b.on) continue;
    const u = (t - b.t0)/(b.t1 - b.t0);
    b.g.position.lerpVectors(b.a, b.b, u);
    if (!b.checked && u >= 1) { b.checked = true; const dx = head.x - b.b.x, dy = head.y - b.b.y; if (dx*dx + dy*dy < 0.2*0.2 && !harmless() && !BOT) bump(t); else dodges++; }
    if (u > 1.6) { b.on = false; b.g.visible = false; }
  }
  // labels + flashes + damage
  for (const L of labels) if (L.m.visible) { const a = (t - L.t)/0.6; L.m.position.y = L.base + a*0.3; L.m.material.opacity = 1 - a; L.m.lookAt(head.x + stage.position.x, head.y, head.z + stage.position.z); if (a >= 1) L.m.visible = false; }
  for (const F of flashes) if (F.m.visible) { const a = (t - F.t)/0.15; F.m.scale.setScalar(1 + a); F.m.material.opacity = 1 - a; if (a >= 1) F.m.visible = false; }
  if (dmg.visible) { const a = (t - dmgT)/0.4; dmg.material.opacity = 0.5*(1 - a); if (a >= 1) dmg.visible = false; }
  if (t > SONG_END) endGame();
}
function enemyFire(T, t){
  const b = bullets.find(x => !x.on); if (!b) return;
  const F = flashes[flashI++ % flashes.length]; F.m.position.copy(T.g.position); F.m.position.z += 0.1; F.m.rotation.copy(T.g.rotation); F.t = t; F.m.visible = true;
  b.on = true; b.checked = false; b.g.visible = true; b.t0 = t; b.t1 = T.data.t + T.data.fire*SPB;
  b.a.copy(T.g.position); b.a.y += S_OFF(T); b.b.set(head.x, head.y, head.z);
  _v.copy(b.b).add(stage.position); b.g.position.copy(b.a); b.g.lookAt(_v);
}
const S_OFF = T => T.slot.w ? 0.0 : 0.1;

/* =========================================================
   MENU / XR
   ========================================================= */
function resize(){
  camera.aspect = innerWidth/innerHeight;
  const hf = 105*Math.PI/180; camera.fov = Math.min(100, 2*Math.atan(Math.tan(hf/2)/camera.aspect)*180/Math.PI);
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(loop);

$('pv').onclick = async () => {
  await initAudio(); mode = 'preview'; $('menu').style.display = 'none';
  state = 'ready'; showStartPanel();
  if (BOT || Q.has('autostart')) startGame();
};
if (navigator.xr) navigator.xr.isSessionSupported('immersive-vr').then(ok => {
  $('vr').disabled = !ok; $('vr').textContent = ok ? 'ENTER VR' : 'VR NOT AVAILABLE';
}).catch(() => { $('vr').textContent = 'VR NOT AVAILABLE'; });
else $('vr').textContent = 'VR NOT AVAILABLE';
$('vr').onclick = async () => {
  try {
    await initAudio();
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
    await renderer.xr.setSession(session);
    renderer.xr.setFoveation(1);
    mode = 'vr'; $('menu').style.display = 'none'; stage.position.set(0, 0, 0); calibY = 1.6; state = 'ready'; showStartPanel();
    session.addEventListener('end', () => { state = 'menu'; $('menu').style.display = 'flex'; panel.visible = false; hud.visible = false; camera.position.set(0, 1.6, 0); });
  } catch (e) { MSG('Could not start VR: ' + e.message); }
};

// test hooks
window.__ss = { camera, targets, bullets, CHART, SONG, SLOTS, SPB, BARS, get state(){ return state; }, get t(){ return ctx ? songTime() : 0; }, stats: () => ({ score, combo, maxCombo, shots, hits, tHits, misses, squats, dodges, bumps }) };
MSG('');
</script>
</body>
</html>
